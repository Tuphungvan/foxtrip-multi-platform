plugins {
    id 'java-library'
}

description = 'Foxtrip Travel Booking System - Reviews & Notifications Module'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Internal dependency on common module
    api project(':foxtrip-common')

    // Internal dependency on tour module (for Tour entity)
    implementation project(':foxtrip-tour')

    // Internal dependency on user module (for User entity)
    implementation project(':foxtrip-user')

    // Internal dependency on location module
    implementation project(':foxtrip-location')

    // Internal dependency on order module (for Buyer verification)
    implementation project(':foxtrip-order')

    // Spring Data JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Spring Web
    implementation 'org.springframework:spring-web'
    implementation 'org.springframework:spring-webmvc'

    // Servlet API
    compileOnly 'jakarta.servlet:jakarta.servlet-api'

    // Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Spring Security (for @PreAuthorize)
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // MapStruct
    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    // Annotation processors
    annotationProcessor 'org.hibernate.orm:hibernate-jpamodelgen'

    // Test dependencies
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mockito:mockito-core'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}





