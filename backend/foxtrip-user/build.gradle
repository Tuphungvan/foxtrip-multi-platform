plugins {
    id 'java-library'
}

description = 'Foxtrip Travel Booking System - User Management Module'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Internal dependency on common module
    api project(':foxtrip-common')

    implementation 'org.springframework.security:spring-security-oauth2-jose:6.3.1'
    implementation 'org.springframework.security:spring-security-oauth2-resource-server:6.3.1'

    implementation 'com.google.http-client:google-http-client-gson:1.42.0'

    // Spring Data JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Spring Web
    implementation 'org.springframework:spring-web'
    implementation 'org.springframework:spring-webmvc'

    // Servlet API
    compileOnly 'jakarta.servlet:jakarta.servlet-api'

    // Spring Security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Mail
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // JWT signing (Nimbus)
    implementation 'com.nimbusds:nimbus-jose-jwt:10.8'

    // Google OAuth token verification
    implementation 'com.google.api-client:google-api-client:2.5.0'

    // MapStruct
    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    // Annotation processors
    annotationProcessor 'org.hibernate.orm:hibernate-jpamodelgen'

    // Test dependencies
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mockito:mockito-core'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}




